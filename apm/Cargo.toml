[workspace]
members = ["."]
resolver = "2"

[package]
name = "apm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Host-side Anix package builder, verifier, and isolated package manager"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
hex = "0.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "apm"
path = "src/bin/apm.rs"

[[bin]]
name = "apkg-build"
path = "src/bin/apkg-build.rs"

[[bin]]
name = "apkg-verify"
path = "src/bin/apkg-verify.rs"

[[bin]]
name = "apkg-repo-sign"
path = "src/bin/apkg-repo-sign.rs"

[[bin]]
name = "apkg-keygen"
path = "src/bin/apkg-keygen.rs"
